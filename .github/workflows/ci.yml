name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install document dependencies
        run: python -m pip install --only-binary=:all: -r canvas-study/requirements.txt
      - name: Run helper tests
        run: python canvas-study/tests/test_helpers.py
      - name: Validate and build distributable
        run: python tools/build_release.py
